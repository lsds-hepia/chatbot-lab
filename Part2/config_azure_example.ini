[azure]
azure_openai_endpoint = https://your-resource-name.openai.azure.com/
azure_openai_api_key = YOUR_AZURE_OPENAI_API_KEY
azure_api_version = 2024-02-01
chat_deployment_name = gpt-4o  # Your deployed chat model name
embedding_deployment_name = text-embedding-ada-002  # Your deployed embedding model name

[opensearch]
endpoint = YOUR_OPENSEARCH_ENDPOINT
index_name = YOUR_INDEX_NAME
# If using authentication:
# username = YOUR_OPENSEARCH_USERNAME
# password = YOUR_OPENSEARCH_PASSWORD
