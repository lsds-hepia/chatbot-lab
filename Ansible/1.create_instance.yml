---
- name: Create EC2 instance
  hosts: localhost
  vars_files:
    - config.yml
  gather_facts: false
  become: False
  vars:
    #instance_type: t4g.micro
    instance_type: t2.micro
    instance_count: 30

  tasks:
    - name: EC2 instances creation
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}{{ item }}"
        key_name: "{{ key_name }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        network:
          assign_public_ip: true
        security_groups: ["{{ security_group }}"]
        count: 1
        wait: true
        tags:
          user_id: "user{{ item }}"
      register: ec2
      with_sequence: start=1 end="{{ instance_count }}"

    - name: Save IP addresses in "instance_ip.ini" file
      copy:
        content: "[my_hosts]\n{{ ec2.results | map(attribute='instances') | flatten | map(attribute='public_ip_address') | join('\n') }}"
        dest: instance_ip.ini

    # We need instances ID to delete them at the end of the exercise.
    - name: Saving the instances ID in the instance_ids.txt file
      copy:
        content: "{{ ec2.results | map(attribute='instances') | flatten | map(attribute='instance_id') | join('\n') }}"
        dest: ./instance_ids.txt

